<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#121d34" />
    <meta
      name="description"
      content="Hasta la Luna: una aventura espacial de saltos de precisión. Entrena y recorre una campaña procedural."
    />
    <title>Hasta la Luna · CIMA</title>
    <link rel="icon" href="./assets/moon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="play-area" aria-label="Hasta la Luna">
      <div id="stage">
        <div
          id="game"
          role="img"
          aria-label="Astronauta ascendiendo hacia la Luna"
        ></div>
        <div class="game-toolbar">
          <span id="zone-title">T · PRADERA</span>
          <div>
            <button id="sound" aria-label="Activar sonido" aria-pressed="false">
              Sonido OFF
            </button>
            <button id="pause" aria-label="Pausar juego" disabled>Pausa</button>
            <button id="fullscreen" aria-label="Pantalla completa">⛶</button>
          </div>
        </div>
        <div id="mission-status">ENTRENAMIENTO · 25 SALTOS</div>
        <div class="progress" aria-hidden="true">
          <i id="progress-fill"></i>
        </div>
        <div class="ingame-label">
          <span id="altitude">000</span><small>METROS</small>
        </div>
        <p id="help">← → / A D · Mantén ESPACIO y suelta</p>
        <div class="bottom-hud">
          <div class="charge-indicator">
            <span>POTENCIA</span>
            <div><i id="charge-fill"></i></div>
            <b id="charge-label">LISTO</b>
          </div>
          <div class="stats">
            <div><span>TIEMPO</span><strong id="time">00:00</strong></div>
            <div><span>SALTOS</span><strong id="jumps">0</strong></div>
            <div><span>CAÍDAS</span><strong id="falls">0</strong></div>
            <div><span>RÉCORD</span><strong id="best">—</strong></div>
          </div>
        </div>
        <div class="touch-controls" aria-label="Controles táctiles">
          <div>
            <button data-touch="left" aria-label="Mover a la izquierda">
              ←</button
            ><button data-touch="right" aria-label="Mover a la derecha">
              →
            </button>
          </div>
          <button
            class="touch-jump"
            data-touch="jump"
            aria-label="Mantener para cargar y soltar para saltar"
          >
            SALTAR
          </button>
        </div>
        <div id="overlay" class="overlay">
          <div
            class="modal"
            role="dialog"
            aria-modal="true"
            aria-labelledby="modal-title"
          >
            <div class="mission-art" aria-hidden="true">
              <img src="./assets/astronaut-concepts.png" alt="" />
            </div>
            <span class="eyebrow">UNA PROMESA ENTRE ESTRELLAS</span>
            <h1 id="modal-title">Hasta la Luna</h1>
            <p id="modal-copy">Ella te espera al otro lado de las estrellas.</p>
            <div id="mission-options">
              <label for="seed"
                >SEMILLA DE EXPEDICIÓN <span>opcional</span></label
              ><input
                id="seed"
                maxlength="40"
                autocomplete="off"
                spellcheck="false"
                placeholder="Una nueva historia al azar"
              />
              <p id="unlock-note"></p>
            </div>
            <button id="primary" class="primary">Entrenar</button>
            <button id="secondary" class="secondary" hidden></button>
            <button id="training-choice" class="secondary" hidden>
              Repetir entrenamiento
            </button>
            <button id="menu-choice" class="secondary" hidden>
              Menú principal
            </button>
          </div>
        </div>
        <div id="toast" role="status" aria-live="polite"></div>
      </div>
    </main>
    <noscript>Activa JavaScript para jugar.</noscript>
    <script src="./src/loader.js"></script>
  </body>
</html>
